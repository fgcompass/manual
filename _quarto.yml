project:
  type: book
  output-dir: docs

book:
  cover-image: cover.png
  page-footer: 
    left: "Copyright 2025 @ FG-COMPASS"
    background: light
    right: 
      - icon: person
        href: https://drfurtado.github.io/compass-manual/
  title: "FG-COMPASS Manual"
  author: 
    - "Ovande Furtado, Jr., Ph.D."
    - "Jere D. Gallagher, Ph.D."
  date: "04/01/2025"
  downloads: [pdf] 

  chapters:
    - index.qmd
    - i-intro.qmd
    - ii-admin.qmd 
    - references.qmd
  appendices:
    - appendix-a.qmd

bibliography: references.bib
csl: apa.csl

format:
    html:
      theme: cosmo
    pdf:
      documentclass: scrreprt
      number-depth: 2
      header-includes:
        - "\\usepackage{multirow}"
        - "\\usepackage{pdfpages}"
      titlepage: true
      titlepage-image: cover.png

editor: source

