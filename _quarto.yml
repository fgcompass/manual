project:
  type: book
  output-dir: docs

book:
  cover-image: cover.png
  site-url: https://fgcompass.github.io/manual/
  repo-url: https://fgcompass.github.io/site/
  sidebar:
    title: "FG-COMPASS Manual"
  page-footer: 
    left: "Copyright 2025 @ FG-COMPASS"
    background: light
    right: 
      - icon: person
        href: https://fgcompass.github.io/manual/

  author: 
    - name: Furtado, Ovande Jr
      orcid: 0000-0003-3847-6314 
      email: ovandef@csun.edu
      affiliations:
      - name: California State University, Northridge
        department: Department of Kinesiology
        address: 18111 Nordhoff St
        city: Northridge
        region: CA
        postal-code: 91330-8287
    - name: Jere Gallagher
      affiliations:
      - name: University of Pittsburgh
        department: Department of Health and Physical Activity
        city: Pittsburgh
        region: PA
        postal-code: 15260
  date: "04/01/2025"
  downloads: [pdf, epub] 

  chapters:
    - index.qmd
    - i-intro.qmd
    - ii-admin.qmd 
    - references.qmd
  appendices:
    - appendix-a.qmd
citation: true
appendices: true
bibliography: references.bib
csl: apa.csl

format:
  html:
    theme:
      light: cosmo
      dark: [cosmo, css/dark-theme.scss]
  pdf:
    documentclass: scrreprt
    number-depth: 2
    header-includes:
      - "\\usepackage{multirow}"
      - "\\usepackage{pdfpages}"
    titlepage: true
    titlepage-image: cover.png
  epub:
    cover-image: cover.png
    title: "FG-COMPASS Manual"
    epub-cover-image: cover.png
    number-sections: true

editor: source
